<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rise Edge Academy</title><style>
:root{--bg:#f1f5f3;--card:#fff;--ink:#14302a;--mut:#5b7069;--line:#d6e0dc;--pri:#12584a;--on:#fff;--acc:#e3a51b;--bad:#b3362d;--ok:#1d7a4c;--warn:#9a6a05}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a17;--card:#162621;--ink:#e5f0ec;--mut:#9db4ac;--line:#294039;--pri:#4cc2a5;--on:#06231b;--acc:#f0b73a;--bad:#ff8c82;--ok:#6fd6a0;--warn:#f0b73a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#a{max-width:640px;margin:0 auto;padding:12px 12px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}h2,h3{margin:0 0 8px}
input,select,button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;min-height:40px;max-width:100%}input,select{width:100%;margin:0 0 8px}button{cursor:pointer;font-weight:600}button.pri{background:var(--pri);color:var(--on);border-color:var(--pri)}
.bar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;align-items:center}.bar button{white-space:nowrap}.bar .on{background:var(--pri);color:var(--on)}.mut{color:var(--mut);font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.stu{display:flex;justify-content:space-between;width:100%;margin:0 0 6px;border-left:6px solid var(--ok)}.stu.A{border-left-color:var(--bad)}.stu.E{border-left-color:var(--acc)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}#rp{position:fixed;inset:0;background:#fff;color:#000;overflow:auto;z-index:9;padding:12px}#rp .no{margin-bottom:10px}#rp table{width:100%;border-collapse:collapse}#rp td,#rp th{border:1px solid #999;padding:4px 6px;text-align:left}#rp button{color:#000;background:#eee}@media print{#a,.no{display:none!important}#rp{position:static;padding:0}}</style></head><body><div id="rp" hidden></div><div id="a">Loading…</div><script type="module" src="app.js"></script></body></html>
