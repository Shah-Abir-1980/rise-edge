<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rise Edge check</title></head>
<body style="font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto">
<h3>Rise Edge - check</h3>
<div id="o">Checking...</div>
<script type="module">
const o=document.getElementById('o'),row=(ok,t)=>o.insertAdjacentHTML('beforeend','<p style="margin:8px 0;word-break:break-word">'+(ok?'&#9989; ':'&#10060; ')+t+'</p>');
o.textContent='';
let t='';
try{const r=await fetch('app.js?'+Date.now(),{cache:'no-store'});t=await r.text();
 row(r.ok&&t.length>150000,'app.js: HTTP '+r.status+', '+t.length+' characters (should be about 200,000)');
 row(/\}\);\s*$/.test(t),'app.js ending: '+t.slice(-30).replace(/&/g,'&amp;').replace(/</g,'&lt;'))}
catch(e){row(false,'app.js could not be loaded: '+e.message)}
try{new Function('return (async()=>{'+t.replace(/^import .*$/gm,'')+'\n})');row(true,'app.js code is complete (no syntax error)')}
catch(e){row(false,'app.js has a problem: '+e.message)}
let cfg=null;
try{cfg=(await import('./config.js?'+Date.now())).cfg;row(!!(cfg&&cfg.apiKey&&cfg.projectId),'config.js: '+(cfg&&cfg.projectId?'project '+cfg.projectId:'keys missing'))}
catch(e){row(false,'config.js could not be loaded: '+e.message)}
try{const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),F=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
 row(true,'Firebase files reachable');
 const db=F.getFirestore(A.initializeApp(cfg,'chk')),d=await Promise.race([F.getDoc(F.doc(db,'config','inst')),new Promise((_,j)=>setTimeout(()=>j(new Error('no answer in 10 seconds')),10000))]);
 row(true,'Database answers (institute settings '+(d.exists()?'found':'not set')+')')}
catch(e){row(false,'Firebase / database: '+e.message)}
row(true,'Done. Send a screenshot of this page.');
</script></body></html>
